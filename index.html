<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лупи приятеля</title>
<script src="firebase-config.js"></script>
<style>
:root{--bg:#dff1ff;--card:#ffffff;--tx:#17203a;--mut:#5b6784;--ac:#ffb400;--acx:#3a2a00;--hp:#ff4f64;--ok:#1f9d63;--bd:#b9d6ee;--stage:#bfe3ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121634;--card:#1d2350;--tx:#f1f3ff;--mut:#9aa4d6;--ac:#ffc21a;--acx:#2a1d00;--hp:#ff6b7d;--ok:#4fd493;--bd:#2f3880;--stage:#232b66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121634;--card:#1d2350;--tx:#f1f3ff;--mut:#9aa4d6;--ac:#ffc21a;--acx:#2a1d00;--hp:#ff6b7d;--ok:#4fd493;--bd:#2f3880;--stage:#232b66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}
.top small{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.money{background:var(--ac);color:var(--acx);padding:6px 14px;border-radius:999px}
.stage{position:relative;margin:12px 0;background:var(--stage);border:3px solid var(--bd);border-radius:24px;padding:14px;text-align:center;touch-action:manipulation;cursor:pointer;overflow:hidden}
.name{font-size:26px;font-weight:900}
.hpbar{height:16px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:300px}
.hpbar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .12s}
.hptx{font-size:13px;color:var(--mut);margin-top:4px}
#face{width:210px;height:210px;display:block;margin:6px auto 0}
.shake{animation:sh .18s}
@keyframes sh{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-9px,2px) rotate(-4deg)}75%{transform:translate(9px,-2px) rotate(4deg)}100%{transform:none}}
.fl{position:absolute;font-weight:900;font-size:26px;color:var(--ac);text-shadow:0 2px 0 var(--acx);pointer-events:none;animation:fl .7s forwards}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.tip{font-size:13px;color:var(--mut);margin-top:6px}
h2{font-size:19px;margin:16px 0 8px}
.w{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.w.on{border-color:var(--ok)}
.w .e{font-size:30px;width:40px;text-align:center}
.w .i{flex:1;min-width:0}
.w b{display:block}
.w span{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:var(--acx);min-width:92px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.eq{background:var(--ok);color:#fff}
button.cur{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.rs{margin-top:18px;background:transparent;color:var(--mut);border:2px solid var(--bd);width:100%}
input,select{-webkit-user-select:text;user-select:text}
#adm-open{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0;width:46px;height:46px;padding:0;border-radius:50%;font-size:22px;opacity:.85;z-index:5}
#adm{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
#adm.open{display:block}
.ap{max-width:520px;margin:0 auto}
.ap h2:first-of-type{margin-top:16px}
.ar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ap input,.ap select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);min-width:0;flex:1 1 140px}
.ap .ghost{background:transparent;color:var(--tx);border:2px solid var(--bd)}
#a-msg{min-height:22px;color:var(--ok);font-weight:700;margin-top:6px}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:var(--ac);color:var(--acx);font-weight:800;padding:14px 16px;border-radius:16px;z-index:20;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
.sw{position:absolute;font-size:36px;pointer-events:none;transform-origin:80% 80%;animation:sw .28s forwards}
@keyframes sw{0%{transform:rotate(-70deg);opacity:1}60%{transform:rotate(25deg);opacity:1}100%{transform:rotate(25deg) scale(1.2);opacity:0}}
.pt{position:absolute;font-size:20px;pointer-events:none;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(200deg);opacity:0}}
.wd{position:absolute;font-weight:900;font-size:18px;color:var(--hp);pointer-events:none;animation:fl .7s forwards}
.fl.crit{font-size:36px;color:var(--hp);text-shadow:0 2px 0 #fff}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fs .25s}
@keyframes fs{0%{opacity:.7}100%{opacity:0}}
.stage.big{animation:big .25s}
@keyframes big{0%,100%{transform:none}30%{transform:translate(6px,-6px) scale(1.02)}60%{transform:translate(-6px,4px)}}
#combo{position:absolute;left:12px;top:10px;font-weight:900;color:var(--ac);text-shadow:0 2px 0 var(--acx);pointer-events:none}
#snd{position:absolute;right:8px;top:8px;min-width:0;padding:4px 8px;background:transparent;font-size:18px}
#ach{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
#ach.open{display:block}
.w.lk{opacity:.5;filter:grayscale(1)}
#ach-open{margin-top:0}
.lv{margin-top:10px}
.lv span{display:block;font-weight:800;font-size:15px;margin-bottom:4px}
.lvb{height:12px;background:var(--bd);border-radius:99px;overflow:hidden}
.lvb i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#pin{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
#pin.open{display:flex}
#pin .box{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:320px}
#pin input{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0;-webkit-user-select:text;user-select:text}
#pin-e{color:var(--hp);font-weight:700;min-height:20px;margin-top:8px}
#kfx{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden;display:none}
#kfx.on{display:block}
#kfx .bg{position:absolute;inset:0;background:radial-gradient(circle,#fff3b0 0,rgba(255,207,31,.55) 40%,transparent 72%);animation:kbg 1.6s forwards}
@keyframes kbg{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#kfx .ttl{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(24px,8vw,40px);font-weight:900;color:#ffcf1f;text-shadow:0 3px 0 #7a5200,0 0 24px #fff;animation:kt 2.6s forwards}
@keyframes kt{0%{transform:scale(.2) rotate(-8deg);opacity:0}15%{transform:scale(1.25) rotate(3deg);opacity:1}25%{transform:scale(1) rotate(0)}85%{opacity:1}100%{transform:scale(1.1);opacity:0}}
#kfx .fall{position:absolute;top:-40px;font-size:28px;animation:kf 2.4s ease-in forwards}
@keyframes kf{to{transform:translateY(110vh) rotate(540deg)}}
#kfx .bst{position:absolute;left:50%;top:45%;font-size:30px;animation:kb 1.4s ease-out forwards}
@keyframes kb{to{transform:translate(var(--dx),var(--dy)) scale(.5) rotate(360deg);opacity:0}}
.wrap.rum{animation:rum .8s}
@keyframes rum{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,2px)}}

@media (prefers-reduced-motion:reduce){.shake,.fl,.sw,.pt,.wd,.stage.big{animation-duration:.01s}}
#boss{position:relative;overflow:hidden;margin:12px 0;background:var(--card);border:3px solid var(--hp);border-radius:24px;padding:12px;text-align:center;cursor:pointer;touch-action:manipulation}
#boss.off{border-color:var(--bd);cursor:default}
#boss .be{font-size:64px;line-height:1}
#boss .bh{height:16px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px auto 0;max-width:300px}
#boss .bh i{display:block;height:100%;width:100%;background:var(--hp);transition:width .12s}
#nk,#lb{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
#nk.open,#lb.open{display:flex}
.bx{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
#nk input{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0}
#nk-e{color:var(--hp);font-weight:700;min-height:20px;margin-top:8px}
.lr{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.lr.me{color:var(--ok);font-weight:800}
.lr b{flex:0 0 34px}.lr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>Лупи приятеля<small id="kills"></small></div>
    <div class="money" id="money"></div>
  </div>

  <div class="lv"><span id="lvt"></span><div class="lvb"><i id="lvf"></i></div></div>
  <div class="tip" id="stat" style="text-align:center"></div>

  <div id="boss"><div class="be" id="b-e"></div><div class="name" id="b-n"></div><div class="bh"><i id="b-hp"></i></div><div class="hptx" id="b-tx"></div><div class="hptx" id="b-me"></div><div class="tip">Босс каждый час. Тапай по нему: здоровье общее для всех игроков</div></div>
  <div class="stage" id="stage">
    <div class="name" id="name"></div>
    <div class="hpbar"><i id="hp"></i></div>
    <div class="hptx" id="hptx"></div>
    <svg id="face" viewBox="0 0 200 200" aria-hidden="true">
      <rect id="body" x="40" y="150" width="120" height="60" rx="26"/>
      <g id="hairb"></g><circle id="head" cx="100" cy="95" r="62" stroke="rgba(0,0,0,.25)" stroke-width="4"/><g id="hair"></g>
      <g id="eyes"></g>
      <path id="mouth" fill="none" stroke="#3b1d1d" stroke-width="6" stroke-linecap="round"/>
      <circle id="bump1" cx="140" cy="62" r="0" fill="#c24b8a" opacity=".7"/>
      <circle id="bump2" cx="62" cy="118" r="0" fill="#c24b8a" opacity=".6"/>
    </svg>
    <div class="tip">Тапай по герою, чтобы ударить</div>
    <div id="flash"></div><div id="combo"></div><button id="snd" aria-label="Звук">🔊</button>
  </div>

  <button class="rs" id="ach-open"></button>
  <button class="rs" id="lb-open" style="margin-top:8px">🏅 Топ по деньгам</button>
  <button class="rs" id="nick-btn" style="margin-top:8px"></button>
  <h2>Магазин оружия</h2>
  <div id="shop"></div>
  <button class="rs" id="reset">Начать заново</button>
</div>

<div id="ach"><div class="ap">
 <div class="top"><div>Достижения</div><button class="ghost" id="ach-close">Закрыть</button></div>
 <div id="ach-list" style="margin-top:12px"></div>
</div></div>
<div id="pin"><div class="box"><b>Секретный вход</b><input id="pin-i" type="password" autocomplete="off" placeholder="Код"><button id="pin-ok">Войти</button> <button id="pin-x" style="background:transparent;color:var(--tx);border:2px solid var(--bd)">Отмена</button><div id="pin-e"></div></div></div>
<div id="nk"><div class="bx"><b>Придумай ник</b><input id="nk-i" maxlength="16" autocomplete="off" placeholder="Твой ник (2–16 символов)"><button id="nk-ok">Сохранить</button> <button id="nk-x" style="background:transparent;color:var(--tx);border:2px solid var(--bd)">Позже</button><div id="nk-e"></div></div></div>
<div id="lb"><div class="bx"><div class="top"><div>🏅 Топ по деньгам</div><button id="lb-x" style="min-width:0">✕</button></div><div id="lb-list" style="margin-top:10px"></div></div></div>
<div id="kfx"></div>
<div id="toast" role="status"></div>
<button id="adm-open" hidden aria-label="Админ-панель">⚙️</button>
<div id="adm"><div class="ap">
 <div class="top"><div>Админ-панель</div><button class="ghost" id="adm-close">Закрыть</button></div>
 <h2>Деньги</h2>
 <div class="ar"><input id="a-amt" type="number" inputmode="numeric" min="1" value="100000"><button id="a-give">Выдать</button></div>
 <div class="ar"><button data-amt="1000">+1 тыс</button><button data-amt="1000000">+1 млн</button><button data-amt="1000000000">+1 млрд</button></div>
 <h2>Предметы</h2>
 <div class="ar"><select id="a-item"></select><button id="a-item-give">Выдать</button></div>
 <div class="ar"><button class="ghost" id="a-item-all">Выдать всё оружие</button></div>
 <h2>Создать персонажа</h2>
 <div class="ar"><input id="a-name" list="a-nl" placeholder="Имя (любое)" maxlength="20"><datalist id="a-nl"></datalist></div>
 <div class="ar"><select id="a-hair"></select><select id="a-hc"></select></div>
 <div class="ar"><select id="a-skin"></select><select id="a-shirt"></select></div>
 <div class="ar"><select id="a-crown"><option value="">Без короны</option><option value="1">С золотой короной</option></select></div>
 <div class="ar"><input id="a-hp" type="number" inputmode="numeric" min="1" placeholder="Здоровье (пусто — по уровню)"><button id="a-spawn">Создать</button></div>
 <div class="ar"><button class="ghost" id="a-kill">Победить текущего</button> <button class="ghost" id="a-lvl">+1 уровень</button></div>
 <div id="a-msg" role="status"></div>
</div></div>
